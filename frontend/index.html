<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Practice Tracker</title>
<style>
  :root {
    --bg: #0f0d0b;
    --panel: #17140f;
    --panel-2: #1e1a13;
    --border: #3d3222;
    --border-soft: #2a231a;
    --accent: #f0a030;
    --accent-dim: #c07d1f;
    --text: #f5f0e6;
    --text-dim: #96897a;
    --danger: #e5564a;
    --success: #6fbf7a;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .app-shell { max-width: 780px; margin: 0 auto; padding: 28px 20px 80px; }

  .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 3px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }

  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border-soft); margin-bottom: 20px; }
  .tab {
    padding: 10px 4px; margin-right: 20px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-dim); cursor: pointer; user-select: none;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 0 0 14px 0;
    border-bottom: 1px solid var(--border-soft); padding-bottom: 10px;
  }
  input, textarea, select {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-family: inherit; font-size: 14px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  label { font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 5px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--accent); color: #14100a;
    border: none; padding: 11px 18px; border-radius: var(--radius); cursor: pointer;
    transition: background 0.12s ease;
  }
  button:hover { background: var(--accent-dim); }
  button.secondary {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    font-weight: 700; padding: 8px 14px;
  }
  button.secondary:hover { background: var(--panel-2); color: var(--text); }
  button.danger-text { color: var(--danger); }
  button.block { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 12px; padding: 10px 12px; background: rgba(229,86,74,0.08); border-left: 3px solid var(--danger); }
  .hidden { display: none !important; }

  .auth-wrap { max-width: 380px; margin: 60px auto 0; }
  .auth-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; }
  .auth-sub { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-soft); }
  .stat-box { text-align: center; padding: 14px 6px; background: var(--panel); }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.04em; }

  .goal-bar-wrap { margin-top: 14px; }
  .goal-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .goal-bar-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .goal-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }

  .session-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  .session-item:last-child { border-bottom: none; }
  .session-left { display: flex; gap: 10px; align-items: flex-start; }
  .type-chip {
    font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 3px 6px; border-radius: 3px;
    background: var(--panel-2); color: var(--accent); white-space: nowrap; margin-top: 2px; letter-spacing: 0.03em;
  }
  .session-main { font-weight: 700; font-size: 14px; }
  .session-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 24px 0; }

  .profile-header { display: flex; align-items: center; gap: 16px; }
  .avatar {
    width: 68px; height: 68px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--accent);
    overflow: hidden; flex-shrink: 0; cursor: pointer; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-hint { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 8px; text-align: center; padding: 3px 0; opacity: 0; transition: opacity 0.15s; text-transform: uppercase; font-weight: 700; }
  .avatar:hover .avatar-hint { opacity: 1; }
  .profile-name { font-size: 17px; font-weight: 800; }
  .profile-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); letter-spacing: 0.03em; }
  .tag.skill { color: var(--accent); border-color: var(--accent-dim); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { width: auto; flex: 1; min-width: 110px; margin-bottom: 0; }

  .suggestion-card {
    display: flex; gap: 12px;
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 12px; margin-bottom: 10px;
  }
  .suggestion-art {
    width: 56px; height: 56px; border-radius: 3px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-dim);
    overflow: hidden;
  }
  .suggestion-art img { width: 100%; height: 100%; object-fit: cover; }
  .suggestion-body { flex: 1; min-width: 0; }
  .suggestion-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .suggestion-title { font-weight: 700; font-size: 14px; }
  .suggestion-artist { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  .suggestion-desc { color: var(--text-dim); font-size: 12px; margin-top: 6px; line-height: 1.45; }
  .suggestion-meta { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .preview-audio { width: 100%; height: 28px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="authView">
    <div class="auth-wrap">
      <div class="auth-title">🎸 PRACTICE TRACKER</div>
      <div class="auth-sub">Track sessions. Get better, on purpose.</div>
      <div class="card">
        <div id="authError" class="error hidden"></div>
        <label>Username</label>
        <input id="authUsername" placeholder="e.g. david" />
        <label>Password</label>
        <input id="authPassword" type="password" placeholder="At least 6 characters" />
        <button class="block" onclick="handleLogin()">Log In</button>
        <div style="height:8px"></div>
        <button class="block secondary" onclick="handleRegister()">Create Account</button>
      </div>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="top-header">
      <div class="brand">
        <div class="brand-mark">🎸</div>
        <div class="brand-name">Practice Tracker</div>
      </div>
      <button class="secondary" onclick="logout()">Log Out</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</div>
      <div class="tab" data-tab="suggestions" onclick="switchTab('suggestions')">Suggestions</div>
      <div class="tab" data-tab="profile" onclick="switchTab('profile')">Profile</div>
    </div>

    <div id="tab-dashboard">
      <div class="card">
        <div class="card-title">Overview</div>
        <div class="stats-grid" id="statsRow"></div>
        <div class="goal-bar-wrap">
          <div class="goal-bar-label"><span id="goalLabel">This week</span><span id="goalFraction"></span></div>
          <div class="goal-bar-track"><div class="goal-bar-fill" id="goalFill" style="width:0%"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Log a Session</div>
        <label>What did you practice?</label>
        <input id="newSong" placeholder="e.g. Blackbird, pentatonic scales..." />
        <div class="row">
          <div>
            <label>Type</label>
            <select id="newType">
              <option value="song">Song</option>
              <option value="fingerstyle">Fingerstyle</option>
              <option value="lick">Lick</option>
              <option value="scale">Scale</option>
              <option value="technique">Technique</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label>Minutes</label>
            <input id="newDuration" type="number" placeholder="30" />
          </div>
        </div>
        <label>Notes (optional)</label>
        <textarea id="newNotes" rows="2" placeholder="What went well, what to work on next..."></textarea>
        <button class="block" onclick="createSession()">Log Session</button>
      </div>

      <div class="card">
        <div class="card-title">Recent Sessions</div>
        <div id="sessionList"></div>
      </div>
    </div>

    <div id="tab-suggestions" class="hidden">
      <div class="card">
        <div class="card-title">Find Something to Practice</div>
        <div class="filter-row">
          <input id="filterSearch" placeholder="Search by title..." oninput="loadSuggestions()" />
        </div>
        <div class="filter-row">
          <select id="filterSkill" onchange="loadSuggestions()">
            <option value="">All skill levels</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <select id="filterType" onchange="loadSuggestions()">
            <option value="">All types</option>
            <option value="song">Songs</option>
            <option value="fingerstyle">Fingerstyle</option>
            <option value="lick">Licks</option>
            <option value="technique">Technique</option>
          </select>
        </div>
        <div id="suggestionsList"></div>
      </div>
    </div>

    <div id="tab-profile" class="hidden">
      <div class="card">
        <div class="profile-header">
          <div class="avatar" onclick="document.getElementById('avatarInput').click()">
            <span id="avatarInitial">?</span>
            <img id="avatarImg" class="hidden" />
            <div class="avatar-hint">Change</div>
          </div>
          <div>
            <div class="profile-name" id="profileUsername">—</div>
            <div class="profile-tags" id="profileTags"></div>
          </div>
        </div>
        <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
      </div>

      <div class="card">
        <div class="card-title">Edit Profile</div>
        <label>About</label>
        <textarea id="profileBio" rows="3" placeholder="Tell your future self (or a recruiter) what you're working toward..."></textarea>
        <div class="row">
          <div>
            <label>Skill Level</label>
            <select id="profileSkill">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
          <div>
            <label>Favorite Genre</label>
            <input id="profileGenre" placeholder="e.g. blues, jazz, rock" />
          </div>
        </div>
        <label>Weekly Practice Goal (minutes)</label>
        <input id="profileGoal" type="number" placeholder="120" />
        <button class="block" onclick="saveProfile()">Save Profile</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:5001/api";
let token = localStorage.getItem("token");
let cachedProfile = null;

function showError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.classList.remove("hidden");
}

async function handleRegister() { await authRequest("register"); }
async function handleLogin() { await authRequest("login"); }

async function authRequest(endpoint) {
  const username = document.getElementById("authUsername").value.trim();
  const password = document.getElementById("authPassword").value;
  try {
    const res = await fetch(`${API_BASE}/${endpoint}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Something went wrong"); return; }
    token = data.token;
    localStorage.setItem("token", token);
    showApp();
  } catch (err) {
    showError("Could not reach the server. Is the Flask backend running?");
  }
}

function logout() {
  token = null;
  localStorage.removeItem("token");
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("authView").classList.remove("hidden");
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...(options.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  return res.json();
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  ["dashboard", "suggestions", "profile"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== name);
  });
  if (name === "suggestions") loadSuggestions();
}

async function showApp() {
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  await loadProfile();
  await refreshData();
}

async function refreshData() {
  const [sessions, stats] = await Promise.all([apiFetch("/sessions"), apiFetch("/stats")]);
  renderStats(stats);
  renderSessions(sessions);
}

function renderStats(stats) {
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-box"><div class="stat-value">${stats.total_sessions}</div><div class="stat-label">Sessions</div></div>
    <div class="stat-box"><div class="stat-value">${stats.total_hours}</div><div class="stat-label">Hours</div></div>
    <div class="stat-box"><div class="stat-value">${Object.keys(stats.minutes_by_song).length}</div><div class="stat-label">Songs</div></div>
    <div class="stat-box"><div class="stat-value">${stats.current_streak}🔥</div><div class="stat-label">Streak</div></div>
  `;

  const goal = (cachedProfile && cachedProfile.weekly_goal_minutes) || 120;
  const pct = Math.min(100, Math.round((stats.minutes_this_week / goal) * 100));
  document.getElementById("goalFraction").textContent = `${stats.minutes_this_week} / ${goal} min`;
  document.getElementById("goalFill").style.width = `${pct}%`;
}

const TYPE_LABELS = { song: "Song", fingerstyle: "Fingerstyle", lick: "Lick", scale: "Scale", technique: "Technique", other: "Other" };

function renderSessions(sessions) {
  const list = document.getElementById("sessionList");
  if (sessions.length === 0) {
    list.innerHTML = `<div class="empty-state">No sessions yet — log your first one above.</div>`;
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="session-item">
      <div class="session-left">
        <span class="type-chip">${TYPE_LABELS[s.session_type] || "Other"}</span>
        <div>
          <div class="session-main">${escapeHtml(s.song_or_skill)}</div>
          <div class="session-meta">${s.duration_minutes} min · ${new Date(s.date).toLocaleDateString()} ${s.notes ? "· " + escapeHtml(s.notes) : ""}</div>
        </div>
      </div>
      <button class="secondary danger-text" onclick="deleteSession(${s.id})">✕</button>
    </div>
  `).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function createSession() {
  const song_or_skill = document.getElementById("newSong").value.trim();
  const duration_minutes = document.getElementById("newDuration").value;
  const notes = document.getElementById("newNotes").value.trim();
  const session_type = document.getElementById("newType").value;
  if (!song_or_skill || !duration_minutes) return;

  await apiFetch("/sessions", { method: "POST", body: JSON.stringify({ song_or_skill, duration_minutes, notes, session_type }) });

  document.getElementById("newSong").value = "";
  document.getElementById("newDuration").value = "";
  document.getElementById("newNotes").value = "";
  await refreshData();
}

async function deleteSession(id) {
  await apiFetch(`/sessions/${id}`, { method: "DELETE" });
  await refreshData();
}

async function loadProfile() {
  const profile = await apiFetch("/profile");
  cachedProfile = profile;

  document.getElementById("profileUsername").textContent = profile.username;
  document.getElementById("profileBio").value = profile.bio || "";
  document.getElementById("profileSkill").value = profile.skill_level || "beginner";
  document.getElementById("profileGenre").value = profile.favorite_genre || "";
  document.getElementById("profileGoal").value = profile.weekly_goal_minutes || 120;

  const tags = [`<span class="tag skill">${profile.skill_level}</span>`];
  if (profile.favorite_genre) tags.push(`<span class="tag">${escapeHtml(profile.favorite_genre)}</span>`);
  document.getElementById("profileTags").innerHTML = tags.join("");

  const avatarImg = document.getElementById("avatarImg");
  const avatarInitial = document.getElementById("avatarInitial");
  if (profile.profile_picture) {
    avatarImg.src = profile.profile_picture;
    avatarImg.classList.remove("hidden");
    avatarInitial.classList.add("hidden");
  } else {
    avatarImg.classList.add("hidden");
    avatarInitial.classList.remove("hidden");
    avatarInitial.textContent = (profile.username || "?")[0].toUpperCase();
  }

  if (!document.getElementById("filterSkill").value) {
    document.getElementById("filterSkill").value = profile.skill_level;
  }
}

async function saveProfile() {
  const bio = document.getElementById("profileBio").value.trim();
  const skill_level = document.getElementById("profileSkill").value;
  const favorite_genre = document.getElementById("profileGenre").value.trim();
  const weekly_goal_minutes = document.getElementById("profileGoal").value;
  await apiFetch("/profile", { method: "PUT", body: JSON.stringify({ bio, skill_level, favorite_genre, weekly_goal_minutes }) });
  await loadProfile();
  await refreshData();
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2000000) {
    alert("Please choose an image under 2MB.");
    return;
  }
  const reader = new FileReader();
  reader.onload = async () => {
    await apiFetch("/profile", { method: "PUT", body: JSON.stringify({ profile_picture: reader.result }) });
    await loadProfile();
  };
  reader.readAsDataURL(file);
}

let suggestionsDebounce = null;
function loadSuggestionsDebounced() {
  clearTimeout(suggestionsDebounce);
  suggestionsDebounce = setTimeout(loadSuggestions, 250);
}

async function loadSuggestions() {
  const skill = document.getElementById("filterSkill").value;
  const type = document.getElementById("filterType").value;
  const search = document.getElementById("filterSearch").value.trim();
  const params = new URLSearchParams();
  if (skill) params.set("skill_level", skill);
  if (type) params.set("type", type);
  if (search) params.set("search", search);

  const results = await apiFetch(`/suggestions?${params.toString()}`);
  const list = document.getElementById("suggestionsList");

  if (results.length === 0) {
    list.innerHTML = `<div class="empty-state">No suggestions match those filters.</div>`;
    return;
  }

  list.innerHTML = results.map(s => {
    const art = s.song_data && s.song_data.artwork_url
      ? `<img src="${s.song_data.artwork_url}" alt="" />`
      : "🎵";
    const artist = s.song_data && s.song_data.artist_name ? s.song_data.artist_name : (s.artist || "");
    const preview = s.song_data && s.song_data.preview_url
      ? `<audio class="preview-audio" controls src="${s.song_data.preview_url}"></audio>`
      : "";

    return `
      <div class="suggestion-card">
        <div class="suggestion-art">${art}</div>
        <div class="suggestion-body">
          <div class="suggestion-top">
            <div>
              <div class="suggestion-title">${escapeHtml(s.title)}</div>
              ${artist ? `<div class="suggestion-artist">${escapeHtml(artist)}</div>` : ""}
            </div>
            <button class="secondary" onclick='quickLog(${JSON.stringify(s.title)}, ${JSON.stringify(s.type)})'>Log</button>
          </div>
          <div class="suggestion-desc">${escapeHtml(s.description)}</div>
          <div class="suggestion-meta">
            <span class="type-chip">${TYPE_LABELS[s.type] || s.type}</span>
            <span class="type-chip">${s.skill_level}</span>
            ${s.genre ? `<span class="type-chip">${escapeHtml(s.genre)}</span>` : ""}
          </div>
          ${preview}
        </div>
      </div>
    `;
  }).join("");
}

// override the inline oninput handler on the search box to debounce properly
document.addEventListener("DOMContentLoaded", () => {
  const searchInput = document.getElementById("filterSearch");
  if (searchInput) searchInput.oninput = loadSuggestionsDebounced;
});

function quickLog(title, type) {
  switchTab("dashboard");
  document.getElementById("newSong").value = title;
  document.getElementById("newType").value = type;
  document.getElementById("newDuration").focus();
}

if (token) {
  showApp().catch(() => logout());
}
</script>
</body>
</html>
